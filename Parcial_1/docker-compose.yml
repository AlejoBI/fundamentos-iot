services:
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nodered:
    build:
      context: .
      dockerfile: docker/node-red/Dockerfile
    container_name: iot-nodered
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      TZ: America/Bogota
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UMBRAL_TEMP: ${UMBRAL_TEMP}
      UMBRAL_GAS: ${UMBRAL_GAS}
      INTERVALO_NORMAL_SEG: ${INTERVALO_NORMAL_SEG}
      INTERVALO_ALERTA_SEG: ${INTERVALO_ALERTA_SEG}
      INTERVALO_EMERGENCIA_SEG: ${INTERVALO_EMERGENCIA_SEG}
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
      - ./flows2.json:/data/flows.json:ro

  adminer:
    image: adminer:4.8.1
    container_name: iot-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  api:
    image: node:20-alpine
    container_name: iot-api
    restart: unless-stopped
    depends_on:
      - nodered
      - mysql
    working_dir: /app
    environment:
      TZ: America/Bogota
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./api:/app
    ports:
      - "3001:3001"
    command: sh -lc "npm install && npm run start"

  simulator:
    build: ./simulator
    container_name: iot-sim-cocina
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SIM_DEVICE_ID: ${DEVICE_ID_SIM}
      SIM_ZONA: ${ZONA_SIM}
      SIM_TEMP_MIN: ${SIM_TEMP_MIN}
      SIM_TEMP_MAX: ${SIM_TEMP_MAX}
      SIM_MQ135_MIN: ${SIM_MQ135_MIN}
      SIM_MQ135_MAX: ${SIM_MQ135_MAX}
      SIM_MISSING_PROB: ${SIM_MISSING_PROB}
      SIM_OUTLIER_PROB: ${SIM_OUTLIER_PROB}
      SIM_DUP_PROB: ${SIM_DUP_PROB}
      SIM_GAP_PROB: ${SIM_GAP_PROB}
      SIM_GAP_SECONDS: ${SIM_GAP_SECONDS}
      UMBRAL_TEMP: ${UMBRAL_TEMP}
      UMBRAL_GAS: ${UMBRAL_GAS}
      INTERVALO_NORMAL_SEG: ${INTERVALO_NORMAL_SEG}
      INTERVALO_ALERTA_SEG: ${INTERVALO_ALERTA_SEG}
      INTERVALO_EMERGENCIA_SEG: ${INTERVALO_EMERGENCIA_SEG}

volumes:
  mysql_data:
  node_red_data:
